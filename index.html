<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam AI Pro - Live Weather & Voice Dashboard</title>
    
    <meta name="theme-color" content="#0d1117">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0b0f19;
            --card-bg: rgba(22, 29, 47, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-urban: #00d2ff;
            --accent-rural: #2ecc71;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at top, #1a233a 0%, #0b0f19 100%);
            padding-bottom: 30px;
        }

        .app-header {
            width: 100%; max-width: 600px; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; background: rgba(11, 15, 25, 0.85);
        }

        .brand { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .brand i { color: #00d2ff; }

        .lang-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-color);
            color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        .main-container { width: 100%; max-width: 600px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .mode-banner {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 14px 18px; display: flex;
            justify-content: space-between; align-items: center;
        }

        .mode-badge { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
        .mode-badge.urban { color: var(--accent-urban); }

        .mode-toggle-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid var(--border-color); color: #fff; padding: 8px 14px;
            border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        .weather-hero-card {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15), rgba(22, 29, 47, 0.85));
            border: 1px solid var(--border-color); border-radius: 24px; padding: 20px;
            display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden;
        }

        .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .location-box h2 { font-size: 1.3rem; font-weight: 700; }
        .location-box p { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        .temp-display { text-align: right; }
        .temp-display .temp-num { font-size: 2.8rem; font-weight: 700; line-height: 1; }
        .temp-display .temp-desc { font-size: 0.85rem; color: var(--accent-urban); font-weight: 600; text-transform: capitalize; }

        .weather-stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 16px; text-align: center;
        }

        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-item span { font-size: 0.75rem; color: var(--text-sub); }
        .stat-item strong { font-size: 0.95rem; }

        .hourly-forecast { display: flex; gap: 12px; overflow-x: auto; padding-top: 5px; }
        .hour-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 10px 14px; text-align: center; min-width: 65px;
            display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem;
        }

        .voice-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 25px 20px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .voice-orb {
            width: 85px; height: 85px; border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: #fff; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); transition: all 0.3s ease;
        }

        .voice-orb.listening { animation: pulse 1.3s infinite; background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        .response-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand"><i class="fa-solid fa-cloud-sun-rain"></i> Mausam AI Pro</div>
        <button class="lang-btn"><i class="fa-solid fa-language"></i> <span>हिंदी</span></button>
    </div>

    <div class="main-container">
        <div class="weather-hero-card">
            <div class="hero-top">
                <div class="location-box">
                    <h2 id="live-city"><i class="fa-solid fa-location-dot" style="color: #00d2ff;"></i> GPS Location Loading...</h2>
                    <p id="live-datetime">--</p>
                </div>
                <div class="temp-display">
                    <div class="temp-num" id="live-temp">--°C</div>
                    <div class="temp-desc" id="live-condition">--</div>
                </div>
            </div>

            <div class="weather-stats-grid">
                <div class="stat-item"><span>AQI</span><strong id="live-aqi">--</strong></div>
                <div class="stat-item"><span>Humidity</span><strong id="live-humidity">--%</strong></div>
                <div class="stat-item"><span>Wind</span><strong id="live-wind">-- km/h</strong></div>
            </div>

            <div class="hourly-forecast" id="hourly-forecast"></div>
        </div>

        <div class="voice-card">
            <div class="voice-orb" onclick="startSpeechRecognition()"><i class="fa-solid fa-microphone"></i></div>
            <div class="voice-status" id="voice-status">Tap mic and ask weather</div>
        </div>

        <div class="response-card">
            <div style="font-weight: 600;"><i class="fa-solid fa-robot"></i> AI Advisory</div>
            <div id="response-text" style="color: #cbd5e1; margin-top: 5px;">Aapka Live Weather Dashboard ready hai!</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://mausam-ai-app.onrender.com";
        let currentWeatherData = null;

        function fetchLiveWeatherByGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => getWeatherData(pos.coords.latitude, pos.coords.longitude),
                    err => getWeatherData(28.6139, 77.2090)
                );
            } else {
                getWeatherData(28.6139, 77.2090);
            }
        }

        async function getWeatherData(lat, lon) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/weather?lat=${lat}&lon=${lon}`);
                const data = await response.json();
                if (data.weather) {
                    currentWeatherData = data;
                    renderWeatherData(data);
                }
            } catch (err) {
                console.error("Backend connection error:", err);
            }
        }

        function renderWeatherData(data) {
            const w = data.weather;
            document.getElementById('live-city').innerHTML = `<i class="fa-solid fa-location-dot" style="color: #00d2ff;"></i> ${w.name}, ${w.sys.country}`;
            document.getElementById('live-temp').innerText = `${Math.round(w.main.temp)}°C`;
            document.getElementById('live-condition').innerText = w.weather[0].description;
            document.getElementById('live-humidity').innerText = `${w.main.humidity}%`;
            document.getElementById('live-wind').innerText = `${Math.round(w.wind.speed * 3.6)} km/h`;
            document.getElementById('live-aqi').innerText = data.aqi ? data.aqi.list[0].main.aqi : 1;
        }

        window.onload = function() {
            document.getElementById('live-datetime').innerText = new Date().toLocaleDateString('hi-IN');
            fetchLiveWeatherByGPS();
        };
    </script>
</body>
</html>
