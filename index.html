<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam AI Pro - SIH 2026</title>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(20, 30, 48, 0.85);
            --text-primary: #e0f2fe;
            --text-secondary: #7dd3fc;
            --accent-color: #22d3ee;
            --accent-glow: rgba(34, 211, 238, 0.4);
            --yellow-warning: #facc15;
            --green-agri: #10b981;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Blind Accessibility Mode */
        body.blind-mode {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-primary: #ffff00;
            --text-secondary: #ffffff;
            --accent-color: #ffff00;
            --accent-glow: rgba(255, 255, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container Frame */
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border: 4px solid #1f2937;
            border-radius: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #111827 0%, #0b0f19 100%);
            overflow-y: auto;
        }

        body.blind-mode .screen { background: #000; }
        .screen.active { display: flex; }

        h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent-color); }
        p { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }

        /* Selection Cards */
        .card-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        
        .action-card {
            background: var(--card-bg);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 12px 16px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-card:hover {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
        }

        /* AI Orb */
        .ai-orb {
            width: 45px; height: 45px;
            background: radial-gradient(circle, var(--accent-color) 0%, #0284c7 100%);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px var(--accent-glow);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .ai-orb:active { transform: scale(0.93); }

        /* Subtitle Box for Deaf Mode */
        #deaf-box {
            background: rgba(0, 0, 0, 0.8);
            color: var(--yellow-warning);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            display: none;
            border: 1px solid var(--yellow-warning);
        }

        /* Weather Panel */
        .weather-panel {
            text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
        }

        /* Universal Action Buttons */
        .u-buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
        }
        .u-btn {
            background: var(--card-bg);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: var(--yellow-warning);
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-size: 0.5rem; cursor: pointer;
        }

        /* Forecast Scroll */
        .forecast-box { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .f-card {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 6px;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .back-btn {
            background: none; border: 1px solid var(--text-secondary);
            color: var(--text-secondary); padding: 6px 12px;
            border-radius: 10px; cursor: pointer; margin-top: 10px;
            align-self: center; font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <div id="screen-lang" class="screen active">
        <div style="text-align: center; margin-top: 10px;">
            <span style="font-size: 2.5rem;">🌐</span>
            <h1 style="margin-top: 5px;">Mausam AI Pro</h1>
            <p>Smart Automation (SIH 2026)</p>
        </div>
        
        <p style="margin-top: 10px; text-align: center;" id="txt-choose-lang">अपनी भाषा चुनें / Choose Preferred Language</p>
        
        <div class="card-grid">
            <div class="action-card" onclick="setLanguage('en-US', 'English')">
                <span>English</span><span>➔</span>
            </div>
            <div class="action-card" onclick="setLanguage('hi-IN', 'हिंदी')">
                <span>हिंदी (Hindi)</span><span>➔</span>
            </div>
            <div class="action-card" onclick="setLanguage('bn-IN', 'বাংলা')">
                <span>বাংলা (Bengali)</span><span>➔</span>
            </div>
            <div class="action-card" onclick="setLanguage('mr-IN', 'मराठी')">
                <span>मराठी (Marathi)</span><span>➔</span>
            </div>
            <div class="action-card" onclick="setLanguage('ta-IN', 'தமிழ்')">
                <span>தமிழ் (Tamil)</span><span>➔</span>
            </div>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div style="text-align: center; margin-top: 20px;">
            <span style="font-size: 2.5rem;">👥</span>
            <h1 id="lbl-profile-title" style="margin-top: 10px;">
